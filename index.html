<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Best HTML Button in the World</title>
    <link rel="stylesheet" href="button.css">
    <style>
        :root {
            color-scheme: light dark;
            --page-bg: #f3f6fb;
            --panel-bg: #ffffff;
            --page-text: #172033;
            --muted-text: #5d6879;
            --line: #d9e0ea;
            --soft-bg: #eef2f7;
            --page-shadow: 0 12px 32px rgba(27, 39, 61, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-width: 320px;
            min-height: 100vh;
            padding: clamp(1rem, 3vw, 2.5rem);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--page-text);
            background: var(--page-bg);
        }

        .container {
            width: min(1180px, 100%);
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(340px, 0.85fr) minmax(0, 1.35fr);
            gap: 1.25rem;
            align-items: start;
        }

        .page-header,
        .gallery {
            grid-column: 1 / -1;
        }

        .page-header h1,
        .panel h2 {
            margin: 0;
            line-height: 1.15;
        }

        .page-header p {
            max-width: 66ch;
            margin: 0.5rem 0 0;
            color: var(--muted-text);
        }

        .panel {
            min-width: 0;
            padding: clamp(1rem, 2vw, 1.5rem);
            border: 1px solid var(--line);
            border-radius: 18px;
            background: var(--panel-bg);
            box-shadow: var(--page-shadow);
        }

        .controls {
            container-type: inline-size;
            font-size: 0.9rem;
        }

        .variable-list {
            margin-top: 1rem;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
        }

        .variable-row {
            display: grid;
            grid-template-columns: minmax(8.5rem, 1fr) minmax(8rem, 1.4fr) auto;
            gap: 0.75rem;
            align-items: center;
            padding: 0.6rem 0.7rem;
            border-bottom: 1px solid var(--line);
        }

        .variable-row:last-child {
            border-bottom: 0;
        }

        .variable-row label {
            min-width: 0;
            font-weight: 650;
            line-height: 1.3;
        }

        .variable-row input[type="range"] {
            display: block;
            width: 100%;
            min-width: 0;
        }

        .variable-row output,
        .resize-controls output {
            display: inline-block;
            min-width: 4.25rem;
            color: var(--muted-text);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .preview-panel {
            display: grid;
            gap: 1rem;
        }

        .preview-panel > p {
            margin: -0.5rem 0 0;
            color: var(--muted-text);
        }

        .preview-stage {
            min-height: 240px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px dashed var(--line);
            border-radius: 14px;
            background-color: var(--soft-bg);
            background-image: radial-gradient(circle, color-mix(in srgb, var(--muted-text) 16%, transparent) 1px, transparent 1px);
            background-size: 16px 16px;
        }

        .resize-box {
            container: button-parent / inline-size;
            width: 320px;
            max-width: 100%;
            min-width: 42px;
            transition: width 120ms ease-out;
        }

        .resize-box .button {
            width: 100%;
        }

        .resize-controls {
            display: grid;
            grid-template-columns: auto minmax(120px, 1fr) 4.25rem;
            gap: 0.75rem;
            align-items: center;
            padding: 0.85rem 1rem;
            border-radius: 12px;
            background: var(--soft-bg);
            font-size: 0.9rem;
        }

        .resize-controls label {
            font-weight: 650;
        }

        .resize-controls input[type="range"] {
            width: 100%;
        }

        .button-grid {
            margin-top: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr));
            gap: 0.9rem;
        }

        .button-grid .button {
            width: 100%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page-bg: #10141c;
                --panel-bg: #191f2a;
                --page-text: #f4f7fb;
                --muted-text: #b8c1cf;
                --line: #364052;
                --soft-bg: #222a37;
                --page-shadow: 0 14px 38px rgba(0, 0, 0, 0.28);
            }
        }

        @media (max-width: 820px) {
            .container {
                grid-template-columns: minmax(0, 1fr);
            }

            .page-header,
            .gallery {
                grid-column: auto;
            }
        }

        @container (max-width: 30rem) {
            .variable-row {
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 0.4rem 0.75rem;
                padding: 0.7rem;
            }

            .variable-row input {
                grid-column: 1 / -1;
                grid-row: 2;
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 0.75rem;
            }

            .panel {
                padding: 1rem;
                border-radius: 14px;
            }

            .resize-controls {
                grid-template-columns: 1fr auto;
            }

            .resize-controls input {
                grid-column: 1 / -1;
                grid-row: 2;
            }

        }
    </style>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Button playground</h1>
            <p>Adjust the design tokens, test the button at different widths, and compare common variants.</p>
        </header>

        <section class="controls panel" aria-labelledby="variables-heading">
            <h2 id="variables-heading">Button variables</h2>
            <div class="variable-list" id="variable-controls"></div>
        </section>

        <section class="preview-panel panel" aria-labelledby="preview-heading">
            <h2 id="preview-heading">Responsive preview</h2>
            <p>The stage stays fixed while the button's parent changes width.</p>
            <div class="preview-stage">
                <div class="resize-box">
                    <button type="button" class="button">Click Me</button>
                </div>
            </div>
            <div class="resize-controls">
                <label for="parent-width-slider">Parent width</label>
                <input id="parent-width-slider" type="range" min="42" max="560" value="320" />
                <output id="parent-width-value">320px</output>
            </div>
        </section>

        <section class="gallery panel" aria-labelledby="gallery-heading">
            <h2 id="gallery-heading">Button variants</h2>
            <div class="button-grid">
                <button type="button" class="button">Button One</button>
                <button type="button" class="button">Button Two</button>
                <button type="button" class="button">Button Three</button>
                <button type="button" class="button">Button Four</button>
                <button type="button" class="button">Button Five</button>
                <button type="button" class="button">Button Six</button>
                <button type="button" class="button" disabled>Disabled</button>
                <button type="button" class="button ghost">Ghost</button>
                <button type="button" class="button align-left">Left Justified</button>
                <button type="button" class="button align-right">Right Justified</button>
            </div>
        </section>
    </main>
    <script>
        const rootEl = document.documentElement;
        const variableContainer = document.getElementById('variable-controls');

        const variables = [
            { name: '--oklch-hue', label: 'Hue', min: 0, max: 360, step: 1, unit: '' },
            { name: '--oklch-saturation', label: 'Saturation', min: 0, max: 1, step: 0.01, unit: '' },
            { name: '--lightness-light', label: 'Lightness (light)', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--lightness-primary', label: 'Lightness (primary)', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--lightness-dark', label: 'Lightness (dark)', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--lightness-darker', label: 'Lightness (darker)', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--accent-hue', label: 'Accent hue', min: 0, max: 360, step: 1, unit: '' },
            { name: '--accent-saturation', label: 'Accent saturation', min: 0, max: 1, step: 0.01, unit: '' },
            { name: '--accent-lightness', label: 'Accent lightness', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--accent-lightness-light', label: 'Accent lightness (light)', min: 0, max: 100, step: 1, unit: '%' },
            { name: '--gradient-angle', label: 'Gradient angle', min: 0, max: 360, step: 1, unit: 'deg' },
            { name: '--unit', label: 'Base unit', min: 4, max: 32, step: 1, unit: 'px' },
            { name: '--border-size', label: 'Border width', min: 0, max: 12, step: 1, unit: 'px' },
            { name: '--gap', label: 'Gap', min: 0, max: 48, step: 1, unit: 'px' },
            { name: '--depth', label: 'Depth', min: 0, max: 24, step: 1, unit: 'px' }
        ];

        const parseValue = (value) => parseFloat(value.trim());
        const formatValue = (value, unit) => `${value}${unit}`;

        const createControlRow = (config) => {
            const row = document.createElement('div');
            row.className = 'variable-row';
            const id = config.name.replace(/--/g, '') + '-slider';
            const current = getComputedStyle(rootEl).getPropertyValue(config.name).trim();
            const raw = parseValue(current) || config.min;
            row.innerHTML = `
                <label for="${id}">${config.label}</label>
                <input id="${id}" type="range" min="${config.min}" max="${config.max}" step="${config.step}" value="${raw}" />
                <output id="${id}-value" for="${id}">${formatValue(raw, config.unit)}</output>
            `;

            const slider = row.querySelector('input');
            const output = row.querySelector('output');

            const updateVariable = (value) => {
                rootEl.style.setProperty(config.name, formatValue(value, config.unit));
                output.textContent = formatValue(value, config.unit);
            };

            slider.addEventListener('input', (event) => {
                updateVariable(event.target.value);
            });

            return row;
        };

        variables.forEach((config) => {
            variableContainer.appendChild(createControlRow(config));
        });

        const parentBoxes = document.querySelectorAll('.resize-box');
        const widthSlider = document.getElementById('parent-width-slider');
        const widthOutput = document.getElementById('parent-width-value');

        const setParentWidth = (value) => {
            parentBoxes.forEach(parentBox => parentBox.style.width = `${value}px`);
            widthOutput.textContent = `${value}px`;
        };

        widthSlider.addEventListener('input', (event) => {
            setParentWidth(event.target.value);
        });

        setParentWidth(widthSlider.value);
    </script>
</body>
</html>
